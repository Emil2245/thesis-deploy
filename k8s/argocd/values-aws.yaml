configs:
  params:
    server.insecure: true
  cm:
    # Traefik se expone por NodePort (sin IP de LoadBalancer en status): sin esto el Ingress quedaría "Progressing" para siempre
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Ingress atendido por Traefik (NodePort tras el ALB)"
      return hs
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: true
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
redis:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
