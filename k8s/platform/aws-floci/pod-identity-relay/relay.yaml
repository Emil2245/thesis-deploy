# Relay de EKS Pod Identity (G2, plan 040). Floci inyecta en los pods AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.23/v1/credentials
# y su propio relay no arranca en la imagen k3s (no hay gestor de paquetes). Este DaemonSet hace lo que haría el agente real:
# publica 169.254.170.23 en cada nodo y reenvía TCP, con TLS verificado contra la CA de Floci, a https://floci:4566 (que entrega
# credenciales temporales ASIA... a cambio del token de cuenta de servicio proyectado). No hay claves estáticas.
apiVersion: v1
kind: Namespace
metadata:
  name: pod-identity
  labels:
    pod-security.kubernetes.io/enforce: privileged   # hostNetwork + NET_ADMIN
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-identity-relay
  namespace: pod-identity
  labels:
    app.kubernetes.io/name: pod-identity-relay
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-identity-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-identity-relay
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - {operator: Exists}
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay
          image: alpine/socat:1.8.1.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ip addr show dev lo | grep -q 169.254.170.23 || ip addr add 169.254.170.23/32 dev lo
              exec socat -T15 TCP-LISTEN:80,bind=169.254.170.23,fork,reuseaddr OPENSSL:floci:4566,cafile=/ca/ca.pem,commonname=floci
          securityContext:
            capabilities: {add: [NET_ADMIN, NET_BIND_SERVICE], drop: [ALL]}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket: {host: 169.254.170.23, port: 80}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: ca, mountPath: /ca, readOnly: true}
      volumes:
        - name: ca
          configMap: {name: floci-ca}
