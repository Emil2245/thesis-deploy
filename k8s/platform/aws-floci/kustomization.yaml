apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform-apps.yaml
  - external-secrets
  - traefik
  - ../kube-prometheus-stack
  - ../tempo
patches:
  # monitoreo ligero (sin Grafana ni Alertmanager) con valores propios del entorno
  - target: {kind: Application, name: kube-prometheus-stack}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/k8s/platform/kube-prometheus-stack/values-aws.yaml
      - op: replace
        path: /spec/sources/0/targetRevision
        value: 92.14.0
      - op: replace
        path: /spec/sources/1/targetRevision
        value: main
  - target: {kind: Application, name: tempo}
    patch: |-
      - op: replace
        path: /spec/sources/1/targetRevision
        value: main
      # Floci desactiva el StorageClass local-path (como EKS sin CSI): Tempo sin PVC (trazas efímeras; retención 72 h no aplica)
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value: {persistence: {enabled: false}}
