# Fluent Bit -> CloudWatch Logs (Floci). Lee los logs de los pods del namespace propuestas y los envía a /propuestas/api.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    pod-security.kubernetes.io/enforce: privileged   # hostPath /var/log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info
        Parsers_File parsers.conf
    [INPUT]
        Name             tail
        Path             /var/log/containers/*_propuestas_*.log
        Tag              kube.*
        multiline.parser cri
        Mem_Buf_Limit    5MB
        Skip_Long_Lines  On
    [OUTPUT]
        Name              cloudwatch_logs
        Match             kube.*
        region            us-east-1
        log_group_name    /propuestas/api
        log_stream_prefix pod-
        auto_create_group Off
        endpoint          floci
        port              4566
        # TLS verificado (G4): el certificado de Floci cubre el nombre "floci" (CoreDNS) y su CA va montada desde el ConfigMap floci-ca
        tls.verify        On
        tls.ca_file       /floci/ca.pem
        sts_endpoint      https://floci:4566
  parsers.conf: |
    [PARSER]
        Name   noop
        Format regex
        Regex  ^(?<log>.*)$
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          imagePullPolicy: IfNotPresent
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          env:
            - {name: AWS_REGION, value: us-east-1}
            # credenciales: pod identity (SA fluent-bit -> rol propuestas-logs), inyectadas por Floci y entregadas por el relay
          securityContext:
            runAsUser: 0   # lee /var/log/pods del nodo (hostPath de solo lectura)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 200Mi}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: ca, mountPath: /floci, readOnly: true}
      volumes:
        - name: config
          configMap: {name: fluent-bit-config}
        - name: varlog
          hostPath: {path: /var/log}
        - name: tmp
          emptyDir: {}
        - name: ca
          configMap: {name: floci-ca}
