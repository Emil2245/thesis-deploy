# Fluent Bit -> CloudWatch Logs (Floci). Lee los logs de los pods del namespace propuestas y los envía a /propuestas/api.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    pod-security.kubernetes.io/enforce: privileged   # hostPath /var/log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info
        Parsers_File parsers.conf
    [INPUT]
        Name             tail
        Path             /var/log/containers/*_propuestas_*.log
        Tag              kube.*
        multiline.parser cri
        Mem_Buf_Limit    5MB
        Skip_Long_Lines  On
    [OUTPUT]
        Name              cloudwatch_logs
        Match             kube.*
        region            us-east-1
        log_group_name    /propuestas/api
        log_stream_prefix pod-
        auto_create_group Off
        endpoint          172.18.0.2
        port              4566
        # Floci sirve HTTPS en 4566 (FLOCI_TLS_ENABLED); el plugin usa TLS siempre ("tls" no es una propiedad válida aquí)
        # y el cert de Floci no cubre la IP, de ahí tls.verify Off (solo en este entorno emulado)
        tls.verify        Off
  parsers.conf: |
    [PARSER]
        Name   noop
        Format regex
        Regex  ^(?<log>.*)$
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          imagePullPolicy: IfNotPresent
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          env:
            - {name: AWS_REGION, value: us-east-1}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aws-workload-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aws-workload-credentials, key: AWS_SECRET_ACCESS_KEY}}
          securityContext:
            runAsUser: 0   # lee /var/log/pods del nodo (hostPath de solo lectura)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 200Mi}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: fluent-bit-config}
        - name: varlog
          hostPath: {path: /var/log}
        - name: tmp
          emptyDir: {}
