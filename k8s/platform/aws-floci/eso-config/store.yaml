# ClusterSecretStore hacia Secrets Manager (Floci). Sin bloque auth: ESO usa la cadena por defecto del SDK, que toma las
# credenciales de pod identity inyectadas en su pod (AWS_CONTAINER_CREDENTIALS_FULL_URI). Endpoint/CA van en el controlador.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: propuestas-db-app
  namespace: propuestas
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target:
    name: propuestas-db-app
    creationPolicy: Owner
  data:
    - {secretKey: username, remoteRef: {key: propuestas/db, property: username}}
    - {secretKey: password, remoteRef: {key: propuestas/db, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: propuestas-jwt
  namespace: propuestas
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target:
    name: propuestas-jwt
    creationPolicy: Owner
  data:
    - {secretKey: privateKey.pem, remoteRef: {key: propuestas/jwt, property: privateKey}}
    - {secretKey: publicKey.pem, remoteRef: {key: propuestas/jwt, property: publicKey}}
