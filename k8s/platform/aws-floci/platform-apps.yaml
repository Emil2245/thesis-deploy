# Aplicaciones de plataforma del entorno aws-floci (plan 040). Orden por sync-wave: ESO -6, monitoreo -5/-4, traefik -4, config ESO -3, relay/logs -2.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pod-identity-relay
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/emil2245/thesis-deploy
    targetRevision: feat/040-floci-sin-brechas
    path: k8s/platform/aws-floci/pod-identity-relay
  destination:
    server: https://kubernetes.default.svc
    namespace: pod-identity
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/emil2245/thesis-deploy
    targetRevision: feat/040-floci-sin-brechas
    path: k8s/platform/aws-floci/eso-config
  destination:
    server: https://kubernetes.default.svc
    namespace: propuestas
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/emil2245/thesis-deploy
    targetRevision: feat/040-floci-sin-brechas
    path: k8s/platform/aws-floci/fluent-bit
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
