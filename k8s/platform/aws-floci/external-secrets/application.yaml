# External Secrets Operator (G3, plan 040) contra Secrets Manager de Floci. Credenciales: pod identity (SA external-secrets -> rol
# propuestas-eso), sin claves estáticas. Endpoint y CA por variables de entorno del SDK de AWS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      valuesObject:
        installCRDs: true
        extraEnv:
          - {name: AWS_ENDPOINT_URL_SECRETS_MANAGER, value: "https://floci:4566"}
          - {name: AWS_ENDPOINT_URL_STS, value: "https://floci:4566"}
          - {name: AWS_CA_BUNDLE, value: /floci/ca.pem}
          - {name: AWS_REGION, value: us-east-1}
        extraVolumes:
          - name: floci-ca
            configMap: {name: floci-ca}
        extraVolumeMounts:
          - {name: floci-ca, mountPath: /floci, readOnly: true}
        resources:
          requests: {cpu: 25m, memory: 64Mi}
        webhook:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
        certController:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
