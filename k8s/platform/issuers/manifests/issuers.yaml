apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# CA local autofirmada, emitida por `selfsigned`; firma los certs del cluster local.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: propuestas-local-ca
  secretName: local-ca
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca
spec:
  ca:
    secretName: local-ca
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # TODO: reemplazar ACME_EMAIL_CHANGE_ME@example.invalid por el correo real antes del deploy prod (no commitear correos personales).
    email: ACME_EMAIL_CHANGE_ME@example.invalid
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: letsencrypt-staging-account-key}
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # TODO: reemplazar ACME_EMAIL_CHANGE_ME@example.invalid por el correo real antes del deploy prod.
    email: ACME_EMAIL_CHANGE_ME@example.invalid
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: letsencrypt-prod-account-key}
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
