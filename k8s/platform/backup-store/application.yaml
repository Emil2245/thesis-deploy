apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backup-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/emil2245/thesis-deploy
    targetRevision: main
    path: k8s/platform/backup-store/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: backup-store
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
