apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: tunnel
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudflared}
  template:
    metadata:
      labels: {app: cloudflared}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.10.3
          args: ["tunnel","--no-autoupdate","--metrics","0.0.0.0:2000","--url","http://traefik.kube-system.svc.cluster.local:80","--http-host-header","propuestas.192.168.1.9.sslip.io"]
          readinessProbe: {httpGet: {path: /ready, port: 2000}}
          livenessProbe: {httpGet: {path: /ready, port: 2000}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
