apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../cnpg-operator
  - ../cert-manager
  - ../sealed-secrets
  - ../kube-prometheus-stack
  - ../issuers
  - ../loki
  - ../tempo
  - ../alloy
  - ../dashboards
  - ../../apps/propuestas-prod
patches:
  # prod: ingress de Grafana con letsencrypt-prod y host PROD_IP (values-prod.yaml)
  - target: {kind: Application, name: kube-prometheus-stack}
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/k8s/platform/kube-prometheus-stack/values-prod.yaml
