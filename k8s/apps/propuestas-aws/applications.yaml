apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: propuestas
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emil2245/thesis-deploy
    targetRevision: main
    path: k8s/propuestas/overlays/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: propuestas
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emil2245/thesis-deploy
    targetRevision: main
    path: k8s/platform/aws-floci/fluent-bit
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated: {prune: true, selfHeal: true}
