apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: propuestas
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/emil2245/thesis-deploy
    targetRevision: feat/040-floci-sin-brechas
    path: k8s/propuestas/overlays/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: propuestas
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
