apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: propuestas
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/emil2245/thesis-deploy
    targetRevision: main
    path: k8s/propuestas/overlays/vps
  destination:
    server: https://kubernetes.default.svc
    namespace: propuestas
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
