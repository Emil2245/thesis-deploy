apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- middleware-redirect-https.yaml
  # plan 010: descomentar tras generar sealed-jwt.yaml con scripts/seal-jwt.sh prod
  # - sealed-jwt.yaml
  # plan 011 bumps these tags
images:
- name: ghcr.io/emil2245/propuestas-api
  newName: ghcr.io/emil2245/propuestas-api
  newTag: 8062db9
- name: ghcr.io/emil2245/propuestas-web
  newName: ghcr.io/emil2245/propuestas-web
  newTag: b5f02dd
configMapGenerator:
- behavior: merge
  literals:
  - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=prod
  name: propuestas-api-config
      # plan 010 replaces PROD_IP
          # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
    # plan 010 replaces PROD_IP
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
    # plan 010 replaces PROD_IP
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
    # plan 010 replaces PROD_IP
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
    # plan 010 replaces PROD_IP
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
    # plan 010 replaces PROD_IP
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
    # plan 010 replaces PROD_IP
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
    # plan 010 replaces PROD_IP
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
    # plan 010 replaces PROD_IP
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
patches:
- patch: |-
    - op: replace
      path: /spec/instances
      value: 2
    - op: replace
      path: /spec/storage/size
      value: 5Gi
  target:
    kind: Cluster
    name: propuestas-db
- patch: |-
    # plan 010 replaces PROD_IP
    - op: replace
      path: /spec/rules/0/host
      value: propuestas.PROD_IP.sslip.io
    - op: add
      path: /metadata/annotations
      value:
        # si hay rate limit de Let's Encrypt, probar primero con letsencrypt-staging
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.middlewares: propuestas-redirect-https@kubernetescrd
    - op: add
      path: /spec/tls
      value:
        - hosts: [propuestas.PROD_IP.sslip.io]
          secretName: propuestas-tls
  target:
    kind: Ingress
    name: propuestas
