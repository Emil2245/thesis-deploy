# Respaldo diario: pg_dump desde RDS -> s3://propuestas-backups/ (Floci).
# Credenciales: Secret aws-workload-credentials (usuario IAM propuestas-workload) porque Floci sin TLS
# no inyecta pod identity; en AWS real se usaría la asociación de pod identity del ServiceAccount.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: propuestas-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: propuestas-workload
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: pg-dump
              image: postgres:18.6-alpine
              command: ["/bin/sh", "-ec"]
              args:
                - pg_dump -h 172.18.0.2 -p 7001 -U "$DB_USER" -d propuestas -Fc -f /backup/propuestas-$(date -u +%Y%m%dT%H%M%SZ).dump
              env:
                - name: DB_USER
                  valueFrom: {secretKeyRef: {name: propuestas-db-app, key: username}}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: propuestas-db-app, key: password}}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup}
          containers:
            - name: s3-upload
              image: amazon/aws-cli:2.38.5
              command: ["/bin/sh", "-ec"]
              args:
                - aws --endpoint-url http://172.18.0.2:4566 s3 cp /backup/ s3://propuestas-backups/db/ --recursive
              env:
                - {name: AWS_DEFAULT_REGION, value: us-east-1}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: aws-workload-credentials, key: AWS_ACCESS_KEY_ID}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: aws-workload-credentials, key: AWS_SECRET_ACCESS_KEY}}
                - {name: HOME, value: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: backup, emptyDir: {}}
            - {name: tmp, emptyDir: {}}
