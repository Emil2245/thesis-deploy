# Respaldo diario: pg_dump desde RDS -> s3://propuestas-backups/ (Floci).
# Credenciales: pod identity (SA propuestas-workload -> rol propuestas-workload); Floci inyecta AWS_CONTAINER_CREDENTIALS_FULL_URI
# y el relay de k8s/platform/aws-floci/pod-identity-relay las entrega. Sin claves estáticas. TLS verificado con la CA de Floci.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: propuestas-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: propuestas-workload
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: pg-dump
              image: postgres:18.6-alpine
              command: ["/bin/sh", "-ec"]
              args:
                - pg_dump -h floci -p 7001 -U "$DB_USER" -d propuestas -Fc -f /backup/propuestas-$(date -u +%Y%m%dT%H%M%SZ).dump
              env:
                - name: DB_USER
                  valueFrom: {secretKeyRef: {name: propuestas-db-app, key: username}}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: propuestas-db-app, key: password}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: s3-upload
              image: amazon/aws-cli:2.38.5
              command: ["/bin/sh", "-ec"]
              args:
                - aws --endpoint-url https://floci:4566 s3 cp /backup/ s3://propuestas-backups/db/ --recursive
              env:
                - {name: AWS_DEFAULT_REGION, value: us-east-1}
                - {name: AWS_CA_BUNDLE, value: /ca/ca.pem}
                - {name: HOME, value: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
                - {name: ca, mountPath: /ca, readOnly: true}
          volumes:
            - {name: backup, emptyDir: {}}
            - {name: tmp, emptyDir: {}}
            - name: ca
              configMap: {name: floci-ca}
