# Overlay "aws": EKS emulado por Floci (infra/aws-floci). Sin CNPG: la base de datos es RDS (PostgreSQL 18).
# Tráfico: ALB (HTTPS 8443) -> NodePort 30080 de Traefik en todos los nodos -> Ingress "propuestas" (web + /api).
# Los Secrets (propuestas-db-app, propuestas-jwt) los crea External Secrets Operator desde Secrets Manager
# (k8s/platform/aws-floci/eso-config); nunca viven en git. Las cargas usan pod identity (sin claves estáticas).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - serviceaccount.yaml
  - backup-cronjob.yaml
images:
  - name: ghcr.io/emil2245/propuestas-api
    newName: 000000000000.dkr.ecr.us-east-1.localhost:4566/propuestas-api
    newTag: 02f8774
  - name: ghcr.io/emil2245/propuestas-web
    newName: 000000000000.dkr.ecr.us-east-1.localhost:4566/propuestas-web
    newTag: 7fdbaf0
configMapGenerator:
  - name: propuestas-api-config
    behavior: merge
    literals:
      # origen del ALB (IP de la VM aws-lab-1 + puerto HTTPS del listener; scripts/aws-floci/up.sh lo valida)
      - CORS_ORIGINS=http://192.168.1.13:8080,https://192.168.1.13:8443
      # trazas directo a Tempo (k8s/platform/tempo); métricas por ServiceMonitor (kube-prometheus-stack)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo.monitoring.svc:4317
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=aws-floci
patches:
  # el CRD de CNPG no existe en este clúster (la base es RDS)
  - target: {kind: Cluster, name: propuestas-db}
    patch: |-
      $patch: delete
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: propuestas-db
  - target: {kind: NetworkPolicy, name: allow-db-access}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-db-access
  # Traefik vive en su propio namespace
  - target: {kind: NetworkPolicy, name: allow-traefik-to-apps}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels
        value: {kubernetes.io/metadata.name: traefik}
  # el Ingress de la base trae un host de ejemplo; aquí atiende cualquier host (el ALB se accede por IP)
  - target: {kind: Ingress, name: propuestas}
    patch: |-
      - op: remove
        path: /spec/rules/0/host
  # base de datos = RDS (proxy de Floci; "floci" resuelve por CoreDNS, ver scripts/aws-floci/cluster-prep.sh)
  - target: {kind: Deployment, name: propuestas-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: jdbc:postgresql://floci:7001/propuestas
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: {kind: Deployment, name: propuestas-web}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
