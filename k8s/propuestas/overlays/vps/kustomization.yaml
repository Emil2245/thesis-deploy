# Overlay "vps": prod (mismas imagenes, que CI actualiza en overlays/prod) + respaldos a S3 + valores GENERICOS de dominio.
# Dominio, emisor TLS, CORS y numero de instancias de la base los inyecta scripts/vps/up.sh como parches de Argo (ver root-vps.yaml).
# Secrets (los crea up.sh en el cluster, nunca en git): propuestas-jwt, propuestas-backup-s3. propuestas-db-app lo genera CNPG.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../prod
  - backup-cronjob.yaml
  - backup-networkpolicy.yaml
patches:
  - target: {kind: Cluster, name: propuestas-db}
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
  - target: {kind: Ingress, name: propuestas}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: propuestas.example.invalid
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: selfsigned-ca
      - op: replace
        path: /spec/tls/0/hosts/0
        value: propuestas.example.invalid
