# Los Jobs de respaldo y de ensayo de restauracion (component=backup) leen la base de datos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-to-db
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: propuestas-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: backup}
      ports:
        - {port: 5432, protocol: TCP}
