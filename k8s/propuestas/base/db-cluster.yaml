apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: propuestas-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  bootstrap:
    initdb:
      database: propuestas
      owner: propuestas
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  monitoring:
    enablePodMonitor: false
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
