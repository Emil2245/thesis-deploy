apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: propuestas-web
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: propuestas-web}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
