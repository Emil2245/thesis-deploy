apiVersion: apps/v1
kind: Deployment
metadata:
  name: propuestas-api
  labels:
    app.kubernetes.io/name: propuestas-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: propuestas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: propuestas-api
    spec:
      terminationGracePeriodSeconds: 40
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      securityContext:
        fsGroup: 185
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: propuestas-api
      initContainers:
        # Espera a que la base acepte conexiones: sin esto la API arranca antes que CloudNativePG, falla en Flyway
        # ("Connection to propuestas-db-rw:5432 refused") y Kubernetes la reinicia (RESTARTS 2 en el primer despliegue).
        # Misma imagen (la reescribe kustomize `images`), solo bash y /dev/tcp; sin herramientas nuevas.
        - name: esperar-db
          image: ghcr.io/emil2245/propuestas-api
          command: ["bash", "-c", "until (exec 3<>/dev/tcp/propuestas-db-rw/5432) 2>/dev/null; do echo 'esperando propuestas-db-rw:5432'; sleep 3; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/emil2245/propuestas-api
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          env:
            - {name: DB_URL, value: "jdbc:postgresql://propuestas-db-rw:5432/propuestas"}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: propuestas-db-app, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: propuestas-db-app, key: password}}
            - {name: JWT_PRIVATE_KEY_LOCATION, value: "file:/etc/propuestas/jwt/privateKey.pem"}
            - {name: JWT_PUBLIC_KEY_LOCATION, value: "file:/etc/propuestas/jwt/publicKey.pem"}
          envFrom:
            - configMapRef: {name: propuestas-api-config}
          startupProbe:
            httpGet: {path: /q/health/started, port: management}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /q/health/live, port: management}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /q/health/ready, port: management}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: jwt, mountPath: /etc/propuestas/jwt, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: jwt
          secret:
            secretName: propuestas-jwt
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
