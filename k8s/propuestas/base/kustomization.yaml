apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: propuestas
resources:
  - namespace.yaml
  - db-cluster.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-servicemonitor.yaml
  - backend-hpa.yaml
  - backend-pdb.yaml
  - web-deployment.yaml
  - web-service.yaml
  - web-hpa.yaml
  - web-pdb.yaml
  - ingress.yaml
  - networkpolicies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: propuestas
configMapGenerator:
  - name: propuestas-api-config
    literals:
      - JWT_ISSUER=https://propuestas.example.invalid
      - CORS_ORIGINS=https://propuestas.example.invalid
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy.monitoring.svc:4317
      - OTEL_SDK_DISABLED=false
      - DISPLAY_PRECISION=2
      - DISPLAY_PRECISION_PORCENTAJE=4
      - JAVA_OPTS_APPEND=-XX:MaxRAMPercentage=75 -Djava.util.logging.manager=org.jboss.logmanager.LogManager
