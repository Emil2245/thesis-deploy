# Isolated local integration. No cluster, IAM or production TLS claims.
# Run from thesis-deploy via scripts/stage03-local-up.sh.
name: propuestas-stage03-local
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: propuestas
      POSTGRES_USER: propuestas
      POSTGRES_PASSWORD: local-stage03-only
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - stage03-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U propuestas -d propuestas"]
      interval: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.27.10
    ports:
      - 127.0.0.1:11025:1025
      - 127.0.0.1:18025:8025

  s3:
    image: floci/floci:2.4.0
    environment:
      FLOCI_BASE_URL: http://localhost:14569
      FLOCI_DOCKER_RESOURCE_NAMESPACE: propuestas-stage03-local
    ports:
      - 127.0.0.1:14569:4566

  documentos:
    build:
      context: ${BACKEND_DIR:-../thesis-back-quarkus}
      dockerfile: documentos/src/main/docker/Dockerfile
    image: propuestas-documentos:stage03-local
    network_mode: host # local-only loopback permits HTTP without weakening Core's HTTPS guard
    group_add: ["${LOCAL_STAGE03_GID:?Use scripts/stage03-local-up.sh}"]
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_started}
    environment:
      QUARKUS_HTTP_HOST: 127.0.0.1
      DOCUMENTOS_HTTP_PORT: 8081
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: file:/run/stage03/service/publicKey.pem
      DOCUMENTOS_STORAGE_BUCKET: propuestas-stage03-local
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://127.0.0.1:14569
      QUARKUS_S3_AWS_REGION: us-east-1
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: test
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: test
      QUARKUS_S3_PATH_STYLE_ACCESS: "true"
    volumes:
      - ./.local-stage03/service/publicKey.pem:/run/stage03/service/publicKey.pem:ro

  core:
    build:
      context: ${BACKEND_DIR:-../thesis-back-quarkus}
      dockerfile: core/src/main/docker/Dockerfile
    image: propuestas-core:stage03-local
    network_mode: host
    group_add: ["${LOCAL_STAGE03_GID:?Use scripts/stage03-local-up.sh}"]
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_started}
      mail: {condition: service_started}
      documentos: {condition: service_started}
    environment:
      QUARKUS_HTTP_HOST: 127.0.0.1
      QUARKUS_HTTP_PORT: 8082
      QUARKUS_MANAGEMENT_HOST: 127.0.0.1
      DB_URL: jdbc:postgresql://127.0.0.1:55432/propuestas
      DB_USER: propuestas
      DB_PASSWORD: local-stage03-only
      JWT_ISSUER: https://propuestas-api.local
      JWT_PRIVATE_KEY_LOCATION: file:/run/stage03/user/privateKey.pem
      JWT_PUBLIC_KEY_LOCATION: file:/run/stage03/user/publicKey.pem
      DOCUMENTOS_BASE_URL: http://127.0.0.1:8081
      DOCUMENTOS_SERVICE_SIGNING_KEY_LOCATION: file:/run/stage03/service/privateKey.pem
      CORE_STORAGE_BUCKET: propuestas-stage03-local
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://127.0.0.1:14569
      QUARKUS_S3_AWS_REGION: us-east-1
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: test
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: test
      QUARKUS_S3_PATH_STYLE_ACCESS: "true"
      OTEL_SDK_DISABLED: "true"
      CORS_ORIGINS: http://127.0.0.1:8080
      APP_FRONTEND_BASE_URL: http://127.0.0.1:8080
      MAIL_MODE: smtp
      QUARKUS_MAILER_HOST: 127.0.0.1
      QUARKUS_MAILER_PORT: 11025
      QUARKUS_MAILER_FROM: local-stage03@local.test
      QUARKUS_MAILER_MOCK: "false"
    volumes:
      - ./.local-stage03/user:/run/stage03/user:ro
      - ./.local-stage03/service:/run/stage03/service:ro

  web:
    build:
      context: ${FRONTEND_DIR:-../thesis-front-react}
      dockerfile: Dockerfile
    image: propuestas-web:stage03-local
    network_mode: host
    depends_on:
      core: {condition: service_started}
    volumes:
      - ./local/stage03-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  stage03-postgres:
